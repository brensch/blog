{{ define "main" }}
<section class="intro">
  <p class="lede">Hello. I am brendan. I make silly things and put them on the internet. Please perceive them.</p>
</section>

<section class="projects">
  {{ range (where .Site.RegularPages "Section" "projects").ByWeight }}
  <a class="project" href="{{ .RelPermalink }}">
    <img src="{{ .Params.image }}" width="600" height="600" alt="{{ .Title }}" loading="lazy">
    <span class="project-name">{{ .Title }}</span>
  </a>
  {{ end }}
</section>
{{ end }}
