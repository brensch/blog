<!doctype html>
<!--
  A Discord DM with the schniff bot, for the schniffer capture. Not Discord:
  a local mock, because Discord can't be filmed without logging in. Every bot
  message is the bot's own template with real values:
    - group create reply: internal/bot/handler_group.go createGroupFromCode
    - add-bulk reply:     internal/bot/handler_addbulk.go
    - availability alert: internal/manager/notifications.go BuildNotificationEmbeds,
      filled from a real Upper Pines alert in the bot's history (5 Jun 2026,
      sites 178 / 009 / 088 for 12–14 Jun)
    - hold DMs:           attemptHoldAndReport + formatBookingOutcome
  The composer posts nothing anywhere.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>schniffer</title>
<style>
  :root {
    --bg: #313338; --bg2: #2b2d31; --bg3: #1e1f22; --text: #dbdee1; --muted: #949ba4;
    --head: #f2f3f5; --link: #00a8fc; --blurple: #5865f2; --code: #2b2d31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.375 "Inter", "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  header { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-bottom: 1px solid #1f2023; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  header img { width: 24px; height: 24px; border-radius: 50%; }
  header b { color: var(--head); font-weight: 600; }
  .app { font-size: 10px; font-weight: 600; background: var(--blurple); color: #fff; border-radius: 3px;
    padding: 1px 4px; margin-left: 4px; vertical-align: 2px; letter-spacing: .02em; }
  #scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: none; }
  #log { display: flex; flex-direction: column; justify-content: flex-end; min-height: 100%; padding: 0 0 18px; }
  .intro { padding: 16px; }
  .intro img { width: 80px; height: 80px; border-radius: 50%; }
  .intro h1 { color: var(--head); font-size: 32px; margin: 8px 0 0; font-weight: 700; }
  .intro p { color: var(--muted); margin: 4px 0 0; }
  .divider { display: flex; align-items: center; margin: 22px 16px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #3f4147; }
  .divider span { padding: 0 8px; }
  .msg { position: relative; padding: 2px 48px 2px 72px; margin-top: 17px; min-height: 44px; animation: in .25s ease-out; }
  .msg.cont { margin-top: 0; min-height: 0; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .msg > .av { position: absolute; left: 16px; top: 4px; width: 40px; height: 40px; border-radius: 50%; }
  .reply + .av { top: 26px; }
  .av.me { background: #e67e22; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 18px; }
  .name { color: var(--head); font-weight: 500; }
  .time { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .body code, .embed code { font: 85% "DejaVu Sans Mono", monospace; background: var(--bg3); padding: 1px 3px; border-radius: 4px; }
  a { color: var(--link); text-decoration: none; }
  .reply { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; margin: 0 0 2px -2px; white-space: nowrap; overflow: hidden; }
  .reply::before { content: ""; position: absolute; left: 34px; top: 12px; width: 32px; height: 10px;
    border-left: 2px solid #4e5058; border-top: 2px solid #4e5058; border-top-left-radius: 6px; }
  .reply i { width: 16px; height: 16px; border-radius: 50%; background: #e67e22; display: inline-block; flex: none; }
  .reply b { color: #c9cdfb; font-weight: 500; }
  .used { color: var(--muted); font-size: 14px; margin-bottom: 2px; }
  .used b { color: #c9cdfb; font-weight: 500; }
  .used code { color: var(--link); background: none; }
  .ephem { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .ephem a { font-size: 12px; }
  .embed { display: grid; max-width: 520px; margin-top: 4px; background: var(--bg2); border-radius: 4px;
    border-left: 4px solid var(--c, #1e1f22); padding: 8px 16px 14px 12px; font-size: 14px; line-height: 1.3; }
  .embed .author { color: var(--head); font-weight: 600; font-size: 14px; margin-top: 6px; }
  .embed .title { color: var(--head); font-weight: 600; font-size: 16px; margin-top: 6px; white-space: pre-wrap; }
  .embed .desc { margin-top: 8px; white-space: pre-wrap; }
  .embed .field { margin-top: 8px; }
  .embed .field b { display: block; color: var(--head); font-weight: 600; margin-bottom: 2px; }
  .embed .field div { white-space: pre-wrap; }
  .embed .foot { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .typing { height: 24px; padding: 0 16px; color: var(--muted); font-size: 13px; flex: none; }
  .typing span { visibility: hidden; }
  .typing.on span { visibility: visible; }
  .dots i { display: inline-block; width: 6px; height: 6px; margin-right: 2px; border-radius: 50%; background: #b5bac1;
    animation: dot 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
  footer { flex: none; padding: 0 16px 0; }
  #composer { width: 100%; border: 0; outline: 0; border-radius: 8px; background: #383a40; color: var(--text);
    font: inherit; padding: 11px 16px; }
  #composer::placeholder { color: #6d6f78; }
  #veil { position: fixed; inset: 0; background: var(--bg); pointer-events: none; animation: lift .45s ease-out forwards; }
  @keyframes lift { to { opacity: 0; } }
</style>
</head>
<body>
<header><img src="bot.png" alt=""><b>schniffer</b><span class="app">APP</span></header>
<div id="scroll"><div id="log">
  <div class="intro">
    <img src="bot.png" alt="">
    <h1>schniffer</h1>
    <p>This is the beginning of your direct message history with <b>schniffer</b>.</p>
  </div>
  <div class="divider"><span>June 1, 2026</span></div>
</div></div>
<div class="typing" id="typing"><span><span class="dots"><i></i><i></i><i></i></span> <b>schniffer</b> is typing…</span></div>
<footer><input id="composer" placeholder="Message @schniffer" autocomplete="off"></footer>
<div id="veil"></div>

<script>
const log = document.getElementById('log');
const scroll = document.getElementById('scroll');
const composer = document.getElementById('composer');
const typing = document.getElementById('typing');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// The slice of Discord markdown the bot uses: links, bold, italics, code.
const md = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/(^|\n)_([^_\n]+)_/g, '$1<i>$2</i>');

const BOT = { name: 'schniffer', av: '<img class="av" src="bot.png" alt="">', app: true };
const ME = { name: 'brendan', av: '<div class="av me">b</div>' };
let last = null;

function add(who, time, html, { pre = '', cont = false } = {}) {
  const el = document.createElement('div');
  const sameAuthor = cont && last === who;
  el.className = 'msg' + (sameAuthor ? ' cont' : '');
  el.innerHTML = sameAuthor ? html
    : `${pre}${who.av}<div><span class="name">${who.name}</span>${who.app ? '<span class="app">APP</span>' : ''}<span class="time">${time}</span></div>${html}`;
  log.appendChild(el);
  last = who;
  requestAnimationFrame(() => scroll.scrollTop = scroll.scrollHeight);
  return el;
}

function embed({ color, author, title, desc, fields = [], foot }) {
  return `<div class="embed" style="--c:${color}">` +
    (author ? `<div class="author">${md(author)}</div>` : '') +
    (title ? `<div class="title">${md(title)}</div>` : '') +
    (desc ? `<div class="desc">${md(desc)}</div>` : '') +
    fields.map((f) => `<div class="field"><b>${md(f.name)}</b><div>${md(f.value.replace(/\n$/, ''))}</div></div>`).join('') +
    (foot ? `<div class="foot">${md(foot)}</div>` : '') + '</div>';
}

function divider(text) {
  const d = document.createElement('div');
  d.className = 'divider';
  d.innerHTML = `<span>${text}</span>`;
  log.appendChild(d);
  last = null;
}

async function botTyping(ms) {
  typing.classList.add('on');
  await wait(ms);
  typing.classList.remove('on');
}

const CG = {
  '232447': 'Yosemite National Park: Upper Pines Campground',
  '232449': 'Yosemite National Park: North Pines Campground',
  '232450': 'Yosemite National Park: Lower Pines Campground',
  '10004152': 'Yosemite National Park: Camp 4',
};
const recgov = (id) => 'https://www.recreation.gov/camping/campgrounds/' + id;

// "/schniff group create name:… code:…" pasted as a DM → onDirectMessage.
async function groupCreate(text) {
  const m = text.match(/name:(.*?)\s+code:(\S+)/i);
  const name = m[1].trim();
  const refs = m[2].split('.').map((k) => k.slice(1));
  add(ME, '06/01/2026 9:41 PM', `<div class="body">${esc(text)}</div>`);
  await botTyping(1100);
  const lines = refs.map((id) => `▸ [${CG[id] || id}](${recgov(id)})`);
  add(BOT, '06/01/2026 9:41 PM', embed({
    color: '#dc88b6', // colorFromName("Yosemite Valley")
    author: 'Saved schniffgroup: ' + name,
    desc: lines.join('\n') + '\n\nSchniff them all with `/schniff add-bulk group:' + name + '`.',
    foot: `${refs.length} site${refs.length === 1 ? '' : 's'}`,
  }), { pre: `<div class="reply"><i></i><b>@brendan</b> ${esc(text)}</div>` });
}

// /schniff add-bulk → an ephemeral interaction reply.
async function addBulk(text) {
  const opt = (k) => (text.match(new RegExp(k + ':(.*?)(?=\\s+\\w+:|$)')) || [])[1]?.trim();
  const group = opt('group'), ci = opt('checkin'), co = opt('checkout');
  const nights = Math.round((Date.parse(co) - Date.parse(ci)) / 864e5);
  await wait(500);
  add(BOT, '06/01/2026 9:42 PM',
    `<div class="body">${md(`Added schniffs for group '${group}' (3/3 campgrounds), dates ${ci} to ${co} (${nights} nights)`)}</div>` +
    `<div class="ephem">👁 Only you can see this • <a>Dismiss message</a></div>`,
    { pre: `<div class="used"><b>brendan</b> used <code>/schniff add-bulk</code></div>` });
}

composer.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !composer.value.trim()) return;
  const text = composer.value.trim();
  composer.value = '';
  if (/^\/?schniff\s+group\s+create/i.test(text)) groupCreate(text);
  else if (/^\/schniff\s+add-bulk/i.test(text)) addBulk(text);
});

const STAY = 'https://www.recreation.gov/camping/campgrounds/232447';
const site = (id, name, gear) => ({
  name,
  value: `📍 standard nonelectric 🛖 ${gear}\n[2 of 2 days available](https://www.recreation.gov/camping/campsites/${id})\nFriday 2026-06-12\nSaturday 2026-06-13\n`,
});

window.step = async (what) => {
  if (what === 'alert') {
    divider('June 5, 2026');
    add(BOT, '06/05/2026 3:03 PM', embed({
      color: '#00ff00',
      title: 'Schniffs ahoy\nYosemite National Park: Upper Pines Campground',
      desc: `[Friday 2026-06-12 ➡️ Sunday 2026-06-14](${STAY})`,
      fields: [
        site('195', '178', 'caravan/camper van, pickup camper, pop up, tent, trailer'),
        site('223', '009', 'caravan/camper van, pickup camper, rv, tent'),
        site('263', '088', 'caravan/camper van, pickup camper, pop up, rv, tent, trailer'),
        { name: 'Important Information', value: [
          '🔗 Links go to booking pages',
          '🏃‍♂️ Campsites at Yosemite book out in 2 minutes',
          '⚠️ Opening links in mobile app goes to your last open page',
          '\nWith 💖 from 🐽',
        ].join('\n') },
      ],
    }));
  }
  if (what === 'hold') {
    add(BOT, '', `<div class="body">${md("🛒 I'm attempting to hold site **195** for you right now (Fri Jun 12 → Sun Jun 14, 2 nights). I'll let you know how I go.")}</div>`, { cont: true });
    await botTyping(1300);
    add(BOT, '', `<div class="body">${md('✅ Held site **195** for you (Fri Jun 12 → Sun Jun 14, 2 nights). [Finish checkout](https://www.recreation.gov/cart)\n_⚡ warm tab (fast path) · wall 1.183s_')}</div>`, { cont: true });
  }
};
</script>
</body>
</html>
